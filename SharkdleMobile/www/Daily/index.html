<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="images/favicon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="../">

<title>Sharkdle Daily</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page-shell.css">
<link rel="stylesheet" href="Daily/daily.css">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="mobile.css">
</head>


<body class="shell-page mode-v3-page">

<header class="topbar">
<div class="mode-header">
<p class="panel-kicker mode-kicker">Daily Challenge</p>
<h1>Sharkdle - Daily</h1>
<button class="home-btn" type="button" onclick="window.location.href='index.html'">Home</button>
</div>
</header>


<div class="game-container">
<section class="guess-hero">
<div class="guess-hero-copy">
<h2>Guess the Shark</h2>
<p class="mode-lead">Think you know this shark? Make your guess below.</p>
<div style="position: relative;">
<input id="sharkGuess" placeholder="Enter shark name..." autocomplete="off">
<div id="suggestions" class="suggestions-dropdown"></div>
</div>
<button id="guessBtn">Guess</button>
<div id="attempts-left" class="status-pill">Attempts left: 12</div>
<a class="sharchive-help-link" href="Library/index.html" target="_blank" rel="noopener noreferrer">Need help? Visit the Sharchive!</a>
</div>
<div class="guess-hero-art" role="region" aria-label="Confirmed clue profile">
<div class="mystery-profile-panel">
<div class="mystery-profile-top">
<span>Mystery profile</span>
<span class="mystery-profile-ping"></span>
</div>
<div class="mystery-profile-target">
<span class="mystery-profile-mark">?</span>
<div>
<strong>Unknown species</strong>
<small>Profile locked</small>
</div>
</div>
<div class="mystery-profile-rows">
<div class="mystery-profile-row" data-profile-key="family"><span>Family</span><span class="mystery-profile-value"></span></div>
<div class="mystery-profile-row" data-profile-key="order"><span>Order</span><span class="mystery-profile-value"></span></div>
<div class="mystery-profile-row" data-profile-key="genus"><span>Genus</span><span class="mystery-profile-value"></span></div>
<div class="mystery-profile-row" data-profile-key="size"><span>Size</span><span class="mystery-profile-value"></span></div>
<div class="mystery-profile-row" data-profile-key="depth"><span>Depth</span><span class="mystery-profile-value"></span></div>
<div class="mystery-profile-row" data-profile-key="yod"><span>Discovery</span><span class="mystery-profile-value"></span></div>
</div>
</div>
</div>
</section>
<div id="message"></div>


<!-- CURRENT GUESSES -->

<div id="guesses"></div>

</div>


<div id="win-screen"></div>

<button id="show-results-btn" onclick="document.getElementById('win-screen').style.display='block'; document.getElementById('show-results-btn').style.display='none';" style="display: none; position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; background: #00bcd4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.3s; z-index: 999;">👀 Show Results</button>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="sharks.js"></script>
<script src="script.js"></script>
<script src="species-tracker.js"></script>
<script src="Achievements/achievements.js"></script>
<script src="Daily/daily.js"></script>

<script src="global-broadcast.js"></script>
</body>

</html>

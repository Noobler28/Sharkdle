<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="images/favicon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="../">

<title>Sharkdle - Infinite</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page-shell.css">
<link rel="stylesheet" href="Infinite/infinite.css">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="mobile.css">
</head>


<body class="shell-page mode-v3-page">

<header class="topbar">
<div class="mode-header">
<p class="panel-kicker mode-kicker">Infinite Mode</p>
<h1>Sharkdle - Infinite</h1>
<button class="home-btn" type="button" onclick="window.location.href='index.html'">Home</button>
</div>
</header>


<div class="game-container">
<section class="guess-hero">
<div class="guess-hero-copy">
<h2>Guess the Shark</h2>
<p class="mode-lead">Think you know this shark? Make your guess below.</p>
<div style="position: relative;">
<input id="sharkGuess" placeholder="Enter shark name..." autocomplete="off">
<div id="suggestions" class="suggestions-dropdown"></div>
</div>
<button id="guessBtn">Guess</button>
<div id="attempts-left" class="status-pill">Attempts left: 12</div>
</div>
<div class="guess-hero-art" aria-hidden="true">
<img class="guess-hero-bg" src="images/home-v3/shark-bg.png" alt="">
<img class="guess-hero-fg" src="images/home-v3/shark-fg.png" alt="">
</div>
</section>
<div id="message"></div>


<!-- CURRENT GUESSES -->

<div id="guesses"></div>

</div>

<button id="show-results-btn" onclick="document.getElementById('win-lose-screen').style.display='block'; document.getElementById('show-results-btn').style.display='none';" style="display: none; position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; background: #00bcd4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.3s; z-index: 999;">👀 Show Results</button>

<div id="win-lose-screen"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="sharks.js"></script>
<script src="script.js"></script>
<script src="Achievements/achievements.js"></script>
<script src="Infinite/infinite.js"></script>

<script src="global-broadcast.js"></script>
</body>

</html>
